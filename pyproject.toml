[project]
name = "credit-risk-lab"
version = "0.3.0"
description = "Quantitative credit risk research: PD/LGD modeling, credit scoring, Basel III analytics"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Erick Condoy", email = "erick@credit-risk-lab" }
]
requires-python = ">=3.11"
keywords = ["credit-risk", "machine-learning", "econometrics", "banking", "scorecard", "marimo"]

dependencies = [
    # Core data
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "pyarrow>=15.0.0",
    # Modeling
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.20.0",
    "altair>=5.3.0",
    # Interactive notebooks — Marimo ONLY (Jupyter permanently removed)
    "marimo>=0.13.0",
    # Database
    "duckdb>=0.10.0",
    # Data sources
    "ucimlrepo>=0.0.7",
    "requests>=2.31.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
crl = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
